# UPDATED FOR MICROBOONE
# Mamba Pretraining Configuration

# Default configuration (shared across all variants)
default: &default
  # === Data Paths ===
  data_root: /scratch/midway3/hhall5/BNB_All_NoWire_00.h5?download=1   
  checkpoint_dir: /scratch/midway3/hhall5/checkpoints

  # === Data Configuration ===
  limit_data: true
  limit_size: 1000
  len_chunk: 512
  chunk_training: false

  # === Flags (kept for compatibility with training script) ===
  rep_aaai: false
  loss_reweight: false
  ablate_loss_scale: false
  save_checkpoint: true
  grad_clip_value: 0.1

  # === Training Configuration ===
  batch_size: 32
  local_batch_size: 4
  valid_batch_size: 16
  local_valid_batch_size: 2

  # === Optimization ===
  max_epochs: 1000
  max_lr: 0.0002
  min_lr: 0.00002
  warmup_steps: 500
  n_eval_steps: 500
  total_steps: 10000

  # === Model Configuration ===
  base_dim: 128
  embed_dim: 128
  klen: 30
  dropout: 0.1
  init_std: 0.025

  # === Embedding Configuration ===
  embed_method: add
  pe_method: nerf

  # === Training Settings ===
  num_data_workers: 4
  log_to_screen: true
  save_version: microboone_pretrain

# ============================================================================
# MicroBooNE Mamba — small config for initial testing
# ============================================================================
mamba_microboone:
  <<: *default
  embed_dim: 128
  num_layers_backbone: 6
  d_state: 16
  d_conv: 4
  expand: 2
  klen: 30
  batch_size: 32
  local_batch_size: 4
  valid_batch_size: 16
  local_valid_batch_size: 2
  warmup_steps: 500
  total_steps: 10000
  max_lr: 0.0002
  min_lr: 0.00002
  dropout: 0.1
  save_version: mamba_microboone
